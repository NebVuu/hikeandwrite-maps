name: Build maps

on:
  workflow_dispatch: {}
  # Path-scoped so a change that actually alters the tiles rebuilds them,
  # while a README or docs commit doesn't spend 25 minutes of runners saying
  # the same thing twice. Everything the build reads is under these paths;
  # note the workflow file itself is included, since installing a different
  # tool version changes the output as surely as editing a script does.
  push:
    branches: [main, contour-investigation]
    paths:
      - 'scripts/**'
      - 'regions/**'
      - '.github/workflows/build-maps.yml'
  schedule:
    # Weekly — VersaTiles' `osm.versatiles` alias always resolves to its
    # current planet build (no dated-retention window to match, unlike the
    # Protomaps-era pipeline this replaced), so this just keeps our
    # extracts reasonably fresh against upstream OSM data.
    - cron: '0 3 * * 1'

# One build at a time, globally — not per ref. The publish job uploads to a
# single fixed release tag with `--clobber`, so two overlapping runs would
# race to overwrite each other's assets and could leave the release holding a
# mix of both. Cancelling the older one is the right resolution when the
# trigger is "someone just pushed a fix".
concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  # A matrix can't glob the filesystem, so the region list has to become a
  # job output first. This keeps "add a regions/<iso>.yml and the workflow
  # picks it up" true, which was the point of the serial loops this replaces.
  discover:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # ISO codes rather than paths: an artifact name can't contain a slash,
        # and `region-ba` is a far more useful thing to see in the run summary
        # than a mangled filename.
        run: |
          regions=$(
            for file in regions/*.yml; do basename "$file" .yml; done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Building: $regions"

  # One runner per region instead of one runner doing all five in sequence.
  # Two reasons, both measured: the first full serial run took ~1h15m with
  # "Build contours" alone accounting for 64 min of it, and a single runner
  # has only ~14GB free — which the basemaps plus one region's intermediate
  # DEM/GeoJSON already strain (build-contours.sh deletes its largest
  # intermediate mid-run specifically to survive that). Per-region runners
  # give each region its own 14GB and cut wall-clock to roughly the slowest
  # single region.
  region:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.discover.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pmtiles CLI
        # `pmtiles extract --region` clips each region's basemap and contour
        # tilesets down from the rectangle `versatiles convert` can produce to
        # the country's own tile-aligned shape (see scripts/region-mask.js).
        # `tile-join` is a separate tool again, from the tippecanoe package
        # installed further down.
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles

      - name: Install versatiles CLI
        # Basemap schema pivot (19.08.2026, see TASKS.md "Offline mape"):
        # Protomaps → VersaTiles Shortbread. `--version` is a smoke test —
        # this asset's exact contents were verified from GitHub's release
        # page, not by actually running the binary anywhere yet.
        run: |
          curl -sL https://github.com/versatiles-org/versatiles-rs/releases/download/v4.8.0/versatiles-linux-gnu-x86_64.tar.gz \
            | tar xz versatiles
          sudo mv versatiles /usr/local/bin/versatiles
          versatiles --version

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Install GDAL and tippecanoe (contours)
        # DEBIAN_FRONTEND/NEEDRESTART_MODE: apt-get install on Ubuntu can
        # hang indefinitely waiting for an interactive "restart services?"
        # prompt (needrestart) that nothing running in CI can answer —
        # confirmed 19.08.2026, the very first real run of this step sat
        # stuck for 9+ minutes on exactly this before being cancelled.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin tippecanoe

      - name: Build basemap
        run: |
          chmod +x scripts/build-region.sh
          scripts/build-region.sh "regions/${{ matrix.region }}.yml"

      - name: Build contours
        # Contour lines from Copernicus GLO-30. Needs build-region.sh to have
        # run first for this region: it produces both the boundary GeoJSON and
        # the tile mask this step's `gdalwarp -cutline` uses.
        env:
          CONTOUR_DIAGNOSTICS: ${{ github.ref != 'refs/heads/main' && '1' || '0' }}
        run: |
          chmod +x scripts/build-contours.sh
          scripts/build-contours.sh "regions/${{ matrix.region }}.yml"

      # INVESTIGATION ONLY (contour-investigation branch) — not part of the
      # normal build, never runs on `main`. Checks the tippecanoe-built
      # contours-only file BEFORE tile-join touches it, to see whether the
      # feature drop reported in the published archive's tilestats
      # (`strategies: [..., {"dropped_by_rate": N}, ...]`) is already present
      # at this stage or only appears after merging. See
      # scripts/diagnose-contours.js's own header comment for the full
      # context.
      - name: 'DIAGNOSTIC: contours-only file, before merge'
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p diagnostics
          # Files are named after the region's `iso:` field (e.g. `BA`), not
          # the lowercase `regions/<name>.yml` filename matrix.region carries
          # (e.g. `ba`) — get it the same way build-region.sh does, don't
          # guess the casing. A prior run of this exact step used
          # matrix.region directly, silently found nothing, and wasted a
          # full CI cycle before this was caught.
          #
          # Problem B (tile-join silently dropping ~95% of contour features
          # on merge) is understood and fixed — see the contours-separate-file
          # branch, published as maps-v5: contours now ship as their own
          # file, never merged. This step is scoped to "Problem A" only: the
          # published maps-v5 BA_contours.pmtiles has a healthy aggregate
          # feature count (598,756) but real device decoding at Bjelašnica,
          # Prenj and Volujak — all real mountains, two of them nowhere near
          # a border — found exactly 1 contour feature per tile at every
          # zoom checked. `density` below checks whether that sparseness is
          # already in the raw candidate lines contour-tiers.js hands to
          # tippecanoe (upstream: DEM/gdal_contour/simplify/tiering) or only
          # appears once tippecanoe or the extract clip get involved.
          iso=$(yq '.iso' "regions/${{ matrix.region }}.yml")
          node scripts/diagnose-contour-input.js \
            "build/dem/${iso}/contours_tiered.geojsonl" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"
          for coord in "43.70,18.27" "43.60,17.85"; do
            lat=${coord%,*}; lon=${coord#*,}
            for z in 11 12 14; do
              node scripts/diagnose-contour-density.js \
                "build/dem/${iso}/contours_tiered.geojsonl" "$lat" "$lon" "$z" \
                | tee -a "diagnostics/${{ matrix.region }}.txt"
            done
          done
          node scripts/diagnose-contours.js \
            "dist/${iso}_contours_before_extract.pmtiles" \
            "${{ matrix.region }}: contours after tippecanoe, before extract" \
            --all-tiles "43.70,18.27" "43.60,17.85" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"
          node scripts/diagnose-contours.js \
            "dist/${iso}_contours.pmtiles" \
            "${{ matrix.region }}: contours after extract, before tile-join" \
            --all-tiles "43.70,18.27" "43.60,17.85" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"
          node scripts/diagnose-contours.js \
            "dist/${iso}_contours_simp1.pmtiles" \
            "${{ matrix.region }}: CONTROL A - simplification=1 instead of 10" \
            --all-tiles "43.70,18.27" "43.60,17.85" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"
          node scripts/diagnose-contours.js \
            "dist/${iso}_contours_droprate0.pmtiles" \
            "${{ matrix.region }}: CONTROL B - explicit --drop-rate=0 added" \
            --all-tiles "43.70,18.27" "43.60,17.85" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"

      # Problem B is fixed (contours-separate-file branch, maps-v5) — the
      # merge step and its own A/B diagnostic are irrelevant to Problem A
      # (see comment above) and are skipped here to keep this run fast.
      # Nothing downstream of this job needs dist/<ISO>.pmtiles (the merged
      # file) or Validate max_zoom for this investigation.

      # The boundary GeoJSON travels with the tileset because the publish job
      # needs every region's boundary to build the one shared hillshade mask,
      # and it has no reason to re-run the basemap step to get them.
      - name: Upload region output
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: |
            dist/*.pmtiles
            build/boundaries/*.geojson
            diagnostics/*.txt
          retention-days: 1
          if-no-files-found: error

  # INVESTIGATION ONLY — never runs on `main`. A controlled, minimal
  # reproduction for Problem A: a handful of clean, hand-built lines
  # (scripts/generate-synthetic-contours.js) instead of BA's real
  # 598,756-feature dataset, run through the exact same tippecanoe
  # invocation used in build-contours.sh. Needs no DEM download, no
  # gdal_contour, no build-region.sh — just tippecanoe itself — so it
  # finishes in ~2 minutes instead of the region job's ~15-20. If this
  # still collapses to ~1 feature/tile, that's a minimal, reportable
  # tippecanoe defect independent of scale or content; if it comes through
  # correctly (feature count growing with zoom, as per-feature minzoom
  # should produce), the bug is specific to something about the real
  # dataset instead.
  synthetic-tippecanoe-test:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # Commits its own diagnostics/synthetic.txt directly (like
    # diagnose-summary does for the region matrix) instead of going through
    # an artifact + the shared summary job — deliberately independent of
    # the `region` job so this result lands in ~2-3 minutes without waiting
    # on BA's ~15-20 minute full rebuild.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install tippecanoe
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe

      - name: Generate synthetic input and run tippecanoe
        run: |
          mkdir -p dist diagnostics
          node scripts/generate-synthetic-contours.js > /tmp/synthetic.geojsonl
          tippecanoe \
            --output=dist/synthetic_contours.pmtiles \
            --layer=contours \
            --minimum-zoom=11 \
            --maximum-zoom=14 \
            --simplification=10 \
            --no-feature-limit \
            --no-tile-size-limit \
            --force \
            /tmp/synthetic.geojsonl

      - name: 'DIAGNOSTIC: decode synthetic tiles'
        run: |
          node scripts/diagnose-contours.js \
            dist/synthetic_contours.pmtiles "synthetic: 8 hand-built lines, 2 per tier" \
            --all-tiles 43.6,17.85 \
            | tee -a diagnostics/synthetic.txt

      # RULED OUT: --drop-rate=1 (tippecanoe's own documented "disable"
      # value, per its README — the earlier CONTROL B used =0 instead)
      # produced byte-identical strategies/output to the baseline above.
      # Confirms --drop-rate, at any value, is not the mechanism here.
      #
      # ALSO RULED OUT: explicit tippecanoe.maxzoom=14 per feature (testing
      # whether an unset maxzoom silently pins to minzoom instead of
      # defaulting to --maximum-zoom) came back byte-identical too.
      #
      # Sharper isolation: even the z11 tile alone has 2 features at the
      # SAME minzoom (both tier 11, well-separated, no cascading involved)
      # and only 1 survives — so this was never really about cascading
      # between tiers at all. Next: is `tippecanoe.minzoom` tagging itself
      # the trigger? --no-tippecanoe-tag strips ALL tippecanoe hints, so
      # tippecanoe's own default pyramid logic (no per-feature minzoom)
      # decides zoom appearance — if multiple untagged features in one
      # tile now survive correctly, the bug is specific to per-feature
      # minzoom tagging on lines; if not, it's something else entirely
      # (simplification, or a deeper multi-line-per-tile defect).
      - name: 'CONTROL: no per-feature tippecanoe.minzoom tag at all'
        run: |
          node scripts/generate-synthetic-contours.js --no-tippecanoe-tag > /tmp/synthetic-notag.geojsonl
          tippecanoe \
            --output=dist/synthetic_contours_notag.pmtiles \
            --layer=contours \
            --minimum-zoom=11 \
            --maximum-zoom=14 \
            --simplification=10 \
            --no-feature-limit \
            --no-tile-size-limit \
            --force \
            /tmp/synthetic-notag.geojsonl
          node scripts/diagnose-contours.js \
            dist/synthetic_contours_notag.pmtiles "synthetic: CONTROL no tippecanoe.minzoom tag" \
            --all-tiles 43.6,17.85 \
            | tee -a diagnostics/synthetic.txt

      # ROOT CAUSE CONFIRMED: per-feature `tippecanoe.minzoom` tagging is
      # what collapses tiles to ~1 feature (see offline-maps-rearchitecture
      # memory, 22.08.2026 night). Candidate fix: one tippecanoe run per
      # tier using *global* --minimum-zoom (no per-feature tags at all),
      # then tile-join the 4 outputs into one --layer=contours file — the
      # same merge mechanism already used elsewhere in this pipeline.
      # Verify this actually produces the correct cascading union (z11:
      # tier-11 only, z14: all four tiers) before touching build-contours.sh.
      - name: 'FIX CANDIDATE: per-tier tippecanoe runs + tile-join'
        run: |
          for tier in 11 12 13 14; do
            node scripts/generate-synthetic-contours.js --tier=$tier > /tmp/tier$tier.geojsonl
            tippecanoe \
              --output=dist/tier$tier.pmtiles \
              --layer=contours \
              --minimum-zoom=$tier \
              --maximum-zoom=14 \
              --simplification=10 \
              --no-feature-limit \
              --no-tile-size-limit \
              --force \
              /tmp/tier$tier.geojsonl
          done
          tile-join \
            --output=dist/synthetic_contours_tilejoin.pmtiles \
            --force \
            dist/tier11.pmtiles dist/tier12.pmtiles dist/tier13.pmtiles dist/tier14.pmtiles
          node scripts/diagnose-contours.js \
            dist/synthetic_contours_tilejoin.pmtiles "synthetic: FIX CANDIDATE per-tier + tile-join" \
            --all-tiles 43.6,17.85 \
            | tee -a diagnostics/synthetic.txt

      - name: Commit synthetic diagnostic to this branch
        run: |
          git config user.name 'build-maps diagnostics'
          git config user.email 'actions@github.com'
          git add diagnostics/synthetic.txt
          git commit -m "Synthetic tippecanoe repro for ${{ github.sha }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

  # INVESTIGATION ONLY — never runs on `main`. Reading Actions job logs
  # requires authentication even on a public repo (confirmed: the logs API
  # returns 403 unauthenticated), so the diagnostic steps above write to a
  # file instead of relying on anyone reading step output, and this job
  # commits that file straight into the branch — plain `git fetch` then
  # reads it, no token needed on the reading end.
  diagnose-summary:
    needs: region
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect diagnostic files
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          merge-multiple: true
          path: .

      - name: Commit diagnostics to this branch
        run: |
          git config user.name 'build-maps diagnostics'
          git config user.email 'actions@github.com'
          git add diagnostics/
          git commit -m "Diagnostic run for ${{ github.sha }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

  publish:
    needs: region
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pmtiles CLI
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # Every region's artifact unpacks into the same dist/ + build/boundaries/
      # layout the scripts expect, as if one runner had built them all.
      - name: Collect region outputs
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          merge-multiple: true
          path: .

      - name: List collected files
        run: |
          ls -l dist/
          ls -l build/boundaries/

      # One shared hillshade extract for every region, not a per-country file
      # (see offline-maps-rearchitecture, 21.08.2026 — a per-country ~300MB
      # raster was the biggest single contributor to the "too much to
      # download" complaint that started this rework, and the same Copernicus
      # GLO-30 DEM underlies every country regardless of border). Just a
      # `pmtiles extract` against Mapterhorn's own hosted planet archive, so
      # no GDAL/tippecanoe needed in this job.
      - name: Build regional hillshade
        run: |
          chmod +x scripts/build-hillshade-regional.sh
          scripts/build-hillshade-regional.sh regions/*.yml

      - name: Build manifest
        run: |
          chmod +x scripts/merge-manifest.sh
          scripts/merge-manifest.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-v4 >/dev/null 2>&1 \
            || gh release create maps-v4 \
                 --title "Offline maps v4" \
                 --notes "Per-country extracts clipped to a tile-aligned boundary mask instead of a bounding box, unused Shortbread layers dropped, one shared regional hillshade clipped the same way. Basemap maxzoom stays 14 — VersaTiles' planet source has no deeper data (see scripts/validate-maxzoom.sh). Manifest schema 4: per-asset sha256, no hasContours. See TASKS.md in the HikeAndWrite repo."
          for f in dist/*.pmtiles dist/maps.json; do
            gh release upload maps-v4 "$f" --clobber
          done
