name: Build maps

on:
  workflow_dispatch: {}
  # Path-scoped so a change that actually alters the tiles rebuilds them,
  # while a README or docs commit doesn't spend 25 minutes of runners saying
  # the same thing twice. Everything the build reads is under these paths;
  # note the workflow file itself is included, since installing a different
  # tool version changes the output as surely as editing a script does.
  push:
    branches: [main, contour-investigation]
    paths:
      - 'scripts/**'
      - 'regions/**'
      - '.github/workflows/build-maps.yml'
  schedule:
    # Weekly — VersaTiles' `osm.versatiles` alias always resolves to its
    # current planet build (no dated-retention window to match, unlike the
    # Protomaps-era pipeline this replaced), so this just keeps our
    # extracts reasonably fresh against upstream OSM data.
    - cron: '0 3 * * 1'

# One build at a time, globally — not per ref. The publish job uploads to a
# single fixed release tag with `--clobber`, so two overlapping runs would
# race to overwrite each other's assets and could leave the release holding a
# mix of both. Cancelling the older one is the right resolution when the
# trigger is "someone just pushed a fix".
concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  # A matrix can't glob the filesystem, so the region list has to become a
  # job output first. This keeps "add a regions/<iso>.yml and the workflow
  # picks it up" true, which was the point of the serial loops this replaces.
  discover:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.list.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # ISO codes rather than paths: an artifact name can't contain a slash,
        # and `region-ba` is a far more useful thing to see in the run summary
        # than a mangled filename.
        run: |
          regions=$(
            for file in regions/*.yml; do basename "$file" .yml; done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "regions=$regions" >> "$GITHUB_OUTPUT"
          echo "Building: $regions"

  # One runner per region instead of one runner doing all five in sequence.
  # Two reasons, both measured: the first full serial run took ~1h15m with
  # "Build contours" alone accounting for 64 min of it, and a single runner
  # has only ~14GB free — which the basemaps plus one region's intermediate
  # DEM/GeoJSON already strain (build-contours.sh deletes its largest
  # intermediate mid-run specifically to survive that). Per-region runners
  # give each region its own 14GB and cut wall-clock to roughly the slowest
  # single region.
  region:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.discover.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pmtiles CLI
        # `pmtiles extract --region` clips each region's basemap and contour
        # tilesets down from the rectangle `versatiles convert` can produce to
        # the country's own tile-aligned shape (see scripts/region-mask.js).
        # `tile-join` is a separate tool again, from the tippecanoe package
        # installed further down.
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles

      - name: Install versatiles CLI
        # Basemap schema pivot (19.08.2026, see TASKS.md "Offline mape"):
        # Protomaps → VersaTiles Shortbread. `--version` is a smoke test —
        # this asset's exact contents were verified from GitHub's release
        # page, not by actually running the binary anywhere yet.
        run: |
          curl -sL https://github.com/versatiles-org/versatiles-rs/releases/download/v4.8.0/versatiles-linux-gnu-x86_64.tar.gz \
            | tar xz versatiles
          sudo mv versatiles /usr/local/bin/versatiles
          versatiles --version

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Install GDAL and tippecanoe (contours)
        # DEBIAN_FRONTEND/NEEDRESTART_MODE: apt-get install on Ubuntu can
        # hang indefinitely waiting for an interactive "restart services?"
        # prompt (needrestart) that nothing running in CI can answer —
        # confirmed 19.08.2026, the very first real run of this step sat
        # stuck for 9+ minutes on exactly this before being cancelled.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin tippecanoe

      - name: Build basemap
        run: |
          chmod +x scripts/build-region.sh
          scripts/build-region.sh "regions/${{ matrix.region }}.yml"

      - name: Build contours
        # Contour lines from Copernicus GLO-30. Needs build-region.sh to have
        # run first for this region: it produces both the boundary GeoJSON and
        # the tile mask this step's `gdalwarp -cutline` uses.
        run: |
          chmod +x scripts/build-contours.sh
          scripts/build-contours.sh "regions/${{ matrix.region }}.yml"

      # INVESTIGATION ONLY (contour-investigation branch) — not part of the
      # normal build, never runs on `main`. Checks the tippecanoe-built
      # contours-only file BEFORE tile-join touches it, to see whether the
      # feature drop reported in the published archive's tilestats
      # (`strategies: [..., {"dropped_by_rate": N}, ...]`) is already present
      # at this stage or only appears after merging. See
      # scripts/diagnose-contours.js's own header comment for the full
      # context.
      - name: 'DIAGNOSTIC: contours-only file, before merge'
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p diagnostics
          # Files are named after the region's `iso:` field (e.g. `BA`), not
          # the lowercase `regions/<name>.yml` filename matrix.region carries
          # (e.g. `ba`) — get it the same way build-region.sh does, don't
          # guess the casing. A prior run of this exact step used
          # matrix.region directly, silently found nothing, and wasted a
          # full CI cycle before this was caught.
          iso=$(yq '.iso' "regions/${{ matrix.region }}.yml")
          node scripts/diagnose-contours.js \
            "dist/${iso}_contours.pmtiles" \
            "${{ matrix.region }}: contours-only (pre tile-join)" \
            "43.305,18.665" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"

      # INVESTIGATION ONLY — a true same-region, same-input A/B. The first
      # real test of `--no-tile-size-limit` (22.08.2026, ME) still showed a
      # ~95% post-merge contour loss, matching the ~95% loss measured on a
      # DIFFERENT region (HR) without that flag — too close to trust as a
      # real fix without comparing the flag on vs. off against the exact
      # same inputs. Runs on copies so the real merge step right after this
      # still gets its normal, untouched inputs.
      - name: 'DIAGNOSTIC: A/B test tile-join flags on identical inputs'
        if: github.ref != 'refs/heads/main'
        run: |
          chmod +x scripts/ab-test-tile-join.sh
          iso=$(yq '.iso' "regions/${{ matrix.region }}.yml")
          scripts/ab-test-tile-join.sh \
            "dist/${iso}.pmtiles" "dist/${iso}_contours.pmtiles" /tmp/tilejoin-ab
          for variant in without-fix with-fix with-fix-both; do
            if [ -f "/tmp/tilejoin-ab/${variant}.pmtiles" ]; then
              node scripts/diagnose-contours.js \
                "/tmp/tilejoin-ab/${variant}.pmtiles" \
                "${{ matrix.region }}: A/B tile-join, ${variant}" \
                "43.305,18.665" \
                | tee -a "diagnostics/${{ matrix.region }}.txt"
            fi
          done

      - name: Merge basemap + contours, drop unused layers
        run: |
          chmod +x scripts/merge-basemap-contours.sh
          scripts/merge-basemap-contours.sh "regions/${{ matrix.region }}.yml"

      # INVESTIGATION ONLY — same file coordinate, after tile-join. If this
      # shows the drop and the pre-merge step above didn't, tile-join is the
      # cause (it has its own independent tile-size limit and does not
      # accept tippecanoe's `-r`/`--no-*-limit` flags — see its README
      # section). If both steps already show the drop, tile-join is
      # innocent and it's tippecanoe's own contours-only build at fault.
      - name: 'DIAGNOSTIC: merged file, after tile-join'
        if: github.ref != 'refs/heads/main'
        run: |
          iso=$(yq '.iso' "regions/${{ matrix.region }}.yml")
          node scripts/diagnose-contours.js \
            "dist/${iso}.pmtiles" \
            "${{ matrix.region }}: merged (post tile-join)" \
            "43.305,18.665" \
            | tee -a "diagnostics/${{ matrix.region }}.txt"

      # Catches a build silently capped below what regions/<iso>.yml asked
      # for (see scripts/validate-maxzoom.sh's header comment for the
      # 21.08.2026 incident this exists to catch automatically instead of
      # via a manual header inspection after publish) — must run after the
      # merge step above (that's what produces the final dist/<ISO>.pmtiles)
      # and before the artifact upload, so a mismatch blocks publishing
      # rather than just getting recorded in the manifest.
      - name: Validate max_zoom
        run: |
          chmod +x scripts/validate-maxzoom.sh
          scripts/validate-maxzoom.sh "regions/${{ matrix.region }}.yml"

      # The boundary GeoJSON travels with the tileset because the publish job
      # needs every region's boundary to build the one shared hillshade mask,
      # and it has no reason to re-run the basemap step to get them.
      - name: Upload region output
        uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region }}
          path: |
            dist/*.pmtiles
            build/boundaries/*.geojson
            diagnostics/*.txt
          retention-days: 1
          if-no-files-found: error

  # INVESTIGATION ONLY — never runs on `main`. Reading Actions job logs
  # requires authentication even on a public repo (confirmed: the logs API
  # returns 403 unauthenticated), so the diagnostic steps above write to a
  # file instead of relying on anyone reading step output, and this job
  # commits that file straight into the branch — plain `git fetch` then
  # reads it, no token needed on the reading end.
  diagnose-summary:
    needs: region
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect diagnostic files
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          merge-multiple: true
          path: .

      - name: Commit diagnostics to this branch
        run: |
          git config user.name 'build-maps diagnostics'
          git config user.email 'actions@github.com'
          git add diagnostics/
          git commit -m "Diagnostic run for ${{ github.sha }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

  publish:
    needs: region
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pmtiles CLI
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      # Every region's artifact unpacks into the same dist/ + build/boundaries/
      # layout the scripts expect, as if one runner had built them all.
      - name: Collect region outputs
        uses: actions/download-artifact@v4
        with:
          pattern: region-*
          merge-multiple: true
          path: .

      - name: List collected files
        run: |
          ls -l dist/
          ls -l build/boundaries/

      # One shared hillshade extract for every region, not a per-country file
      # (see offline-maps-rearchitecture, 21.08.2026 — a per-country ~300MB
      # raster was the biggest single contributor to the "too much to
      # download" complaint that started this rework, and the same Copernicus
      # GLO-30 DEM underlies every country regardless of border). Just a
      # `pmtiles extract` against Mapterhorn's own hosted planet archive, so
      # no GDAL/tippecanoe needed in this job.
      - name: Build regional hillshade
        run: |
          chmod +x scripts/build-hillshade-regional.sh
          scripts/build-hillshade-regional.sh regions/*.yml

      - name: Build manifest
        run: |
          chmod +x scripts/merge-manifest.sh
          scripts/merge-manifest.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-v4 >/dev/null 2>&1 \
            || gh release create maps-v4 \
                 --title "Offline maps v4" \
                 --notes "Per-country extracts clipped to a tile-aligned boundary mask instead of a bounding box, unused Shortbread layers dropped, one shared regional hillshade clipped the same way. Basemap maxzoom stays 14 — VersaTiles' planet source has no deeper data (see scripts/validate-maxzoom.sh). Manifest schema 4: per-asset sha256, no hasContours. See TASKS.md in the HikeAndWrite repo."
          for f in dist/*.pmtiles dist/maps.json; do
            gh release upload maps-v4 "$f" --clobber
          done
