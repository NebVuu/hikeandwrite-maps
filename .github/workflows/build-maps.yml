name: Build maps

on:
  workflow_dispatch: {}
  schedule:
    # Weekly — VersaTiles' `osm.versatiles` alias always resolves to its
    # current planet build (no dated-retention window to match, unlike the
    # Protomaps-era pipeline this replaced), so this just keeps our
    # extracts reasonably fresh against upstream OSM data.
    - cron: '0 3 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pmtiles CLI
        # Still needed even after the versatiles-convert basemap pivot below
        # — build-hillshade-regional.sh's `pmtiles extract` step is
        # unrelated to which tool builds the basemap, and merge-basemap-
        # contours.sh's `tile-join` (from the tippecanoe package, installed
        # further down) is a separate tool again.
        run: |
          curl -sL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar xz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles

      - name: Install versatiles CLI
        # Basemap schema pivot (19.08.2026, see TASKS.md "Offline mape"):
        # Protomaps → VersaTiles Shortbread. `--version` is a smoke test —
        # this asset's exact contents were verified from GitHub's release
        # page, not by actually running the binary anywhere yet.
        run: |
          curl -sL https://github.com/versatiles-org/versatiles-rs/releases/download/v4.8.0/versatiles-linux-gnu-x86_64.tar.gz \
            | tar xz versatiles
          sudo mv versatiles /usr/local/bin/versatiles
          versatiles --version

      - name: Install yq
        run: |
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.4/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Build each region
        run: |
          chmod +x scripts/build-region.sh
          for region in regions/*.yml; do
            scripts/build-region.sh "$region"
          done

      # One shared hillshade extract for every region, not a per-country
      # file (see offline-maps-rearchitecture, 21.08.2026 — a per-country
      # ~300MB raster was the biggest single contributor to the "too much
      # to download" complaint that started this rework, and the same
      # Copernicus GLO-30 DEM underlies every country regardless of
      # border). Just a `pmtiles extract` against Mapterhorn's own hosted
      # planet archive (see build-hillshade-regional.sh) — no GDAL/
      # tippecanoe dependency, so this runs right after the basemap step
      # rather than waiting on the GDAL/tippecanoe install below, which
      # contours alone needs. Needs every region's boundary GeoJSON, which
      # the basemap loop above has already produced for all of them.
      - name: Build regional hillshade
        run: |
          chmod +x scripts/build-hillshade-regional.sh
          scripts/build-hillshade-regional.sh regions/*.yml

      - name: Install GDAL and tippecanoe (contours)
        # DEBIAN_FRONTEND/NEEDRESTART_MODE: apt-get install on Ubuntu can
        # hang indefinitely waiting for an interactive "restart services?"
        # prompt (needrestart) that nothing running in CI can answer —
        # confirmed 19.08.2026, the very first real run of this step sat
        # stuck for 9+ minutes on exactly this before being cancelled.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin tippecanoe

      # Contour lines from Copernicus GLO-30, extended from the BA-only
      # trial (19.08.2026) to every region now that the output's been
      # checked and looks right (see offline-maps-rearchitecture,
      # 21.08.2026).
      - name: Build contours
        run: |
          chmod +x scripts/build-contours.sh
          for region in regions/*.yml; do
            scripts/build-contours.sh "$region"
          done

      # Folds each region's contours straight into its basemap .pmtiles —
      # the app downloads one vector file per country, not two (see
      # offline-maps-rearchitecture, 21.08.2026).
      - name: Merge basemap + contours
        run: |
          chmod +x scripts/merge-basemap-contours.sh
          for region in regions/*.yml; do
            scripts/merge-basemap-contours.sh "$region"
          done

      - name: Build manifest
        run: |
          chmod +x scripts/merge-manifest.sh
          scripts/merge-manifest.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view maps-v3 >/dev/null 2>&1 \
            || gh release create maps-v3 \
                 --title "Offline maps v3" \
                 --notes "Basemap+contours merged into one vector .pmtiles per country, one shared regional hillshade file instead of a per-country extract, basemap maxzoom 14->16. See TASKS.md in the HikeAndWrite repo for the pipeline decision."
          for f in dist/*.pmtiles dist/maps.json; do
            gh release upload maps-v3 "$f" --clobber
          done
